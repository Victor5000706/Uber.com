<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber Eats - Sign In</title>
    <link rel="stylesheet" href="Sign up.css">
</head>

<body>

    <!-- Top bar -->
    <header class="top-bar">
        <div class="logo">Uber Eats</div>
    </header>


    <!-- Sign in section -->
    <main class="login-container">

        <div class="login-box">

            <h1>What's your phone number or email?</h1>

            <input
                type="text"
                placeholder="Enter phone number or email"
                class="input-box"
            >

            <button class="continue-btn">
                Continue
            </button>

            <div class="or">
                <span></span>
                <p>or</p>
                <span></span>
            </div>

            <button class="social-btn">
                <span class="google">G</span>
                Continue with Google
            </button>

            <button class="social-btn">
                <span class="apple">●</span>
                Continue with Apple
            </button>

            <div class="or">
                <span></span>
                <p>or</p>
                <span></span>
            </div>

            <p class="terms">
                By continuing, you agree to our
                <u>Terms</u> and
                <u>Privacy Policy</u>.
            </p>

            <p class="message">
                Message and data rates may apply.
            </p>

        </div>

    </main>

</body>
</html>
