<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber Login</title>
    <link rel="stylesheet" href="Schedule ahead.css">
</head>
<body>

    <!-- Top Header -->
    <header class="top-bar">
        <span>Uber</span>
    </header>

    <!-- Login Section -->
    <main class="login-container">

        <div class="login-box">

            <h2>What's your phone number or<br>email?</h2>

            <input 
                type="text" 
                placeholder="Enter phone number or email"
                class="input-field"
            >

            <button class="continue-btn">
                Continue
            </button>

            <div class="divider">
                <span>or</span>
            </div>

            <button class="social-btn">
                <span class="google-icon">G</span>
                Continue with Google
            </button>

            <button class="social-btn">
                <span class="apple-icon">●</span>
                Continue with Apple
            </button>

            <div class="bottom-divider"></div>

            <p class="terms">
                By continuing, you agree to receive calls or text
                messages, including by automated means, from Uber
                and its affiliates at the number provided.
            </p>

        </div>

    </main>

</body>
</html>
