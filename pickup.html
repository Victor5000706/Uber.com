<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber Ride</title>
    <link rel="stylesheet" href="Pickup now.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">Uber</div>

        <nav class="nav">
            <a href="#" class="nav-item active">
                <i class="fa-solid fa-car"></i>
                <span>Ride</span>
            </a>

            <a href="#" class="nav-item">
                <i class="fa-solid fa-tags"></i>
                <span>Rent</span>
            </a>
        </nav>
    </header>

    <!-- Main content -->
    <main class="main">

        <!-- Left panel -->
        <section class="left-panel">

            <div class="booking-card">

                <div class="card-top">
                    <button class="back-button">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>

                    <button class="clear-button">
                        Clear
                    </button>
                </div>

                <h1>When do you want to be picked up?</h1>

                <!-- Date -->
                <div class="select-box">
                    <div class="select-left">
                        <i class="fa-solid fa-calendar-days"></i>
                        <span>Today</span>
                    </div>

                    <i class="fa-solid fa-chevron-down"></i>
                </div>

                <!-- Time -->
                <div class="select-box">
                    <div class="select-left">
                        <i class="fa-solid fa-clock"></i>
                        <span>Now</span>
                    </div>

                    <i class="fa-solid fa-chevron-down"></i>
                </div>

                <!-- Information -->
                <div class="info-list">

                    <div class="info-row">
                        <i class="fa-solid fa-calendar-days"></i>
                        <p>
                            Choose your pickup time up to 30 days
                            <br>
                            in advance
                        </p>
                    </div>

                    <div class="info-row">
                        <i class="fa-solid fa-hourglass-half"></i>
                        <p>
                            Extra wait time included to meet your ride
                        </p>
                    </div>

                    <div class="info-row">
                        <i class="fa-solid fa-bars"></i>
                        <p>
                            Cancel at no charge up to 60 minutes in
                            <br>
                            advance
                        </p>
                    </div>

                </div>

                <a href="#" class="terms">See terms</a>

                <button class="next-button">
                    Next
                </button>

            </div>

        </section>

        <!-- Map -->
        <section class="map">

            <div class="roads road1"></div>
            <div class="roads road2"></div>
            <div class="roads road3"></div>
            <div class="roads road4"></div>
            <div class="roads road5"></div>
            <div class="roads road6"></div>
            <div class="roads road7"></div>
            <div class="roads road8"></div>
            <div class="roads road9"></div>

            <div class="map-label label1">IGANDO ROAD</div>
            <div class="map-label label2">IGANDO ROAD</div>
            <div class="map-label label3">LAGOS BADAGRY EXPRESSWAY</div>
            <div class="map-label label4">LAGOS BADAGRY EXPRESSWAY</div>

            <!-- Decorative roundabout -->
            <div class="roundabout">
                <div class="circle c1"></div>
                <div class="circle c2"></div>
                <div class="circle c3"></div>
                <div class="circle c4"></div>
                <div class="circle c5"></div>
                <div class="center-circle"></div>
            </div>

            <!-- Water -->
            <div class="water"></div>

        </section>

    </main>

</body>
</html>
