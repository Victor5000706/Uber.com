<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber Login</title>
    <link rel="stylesheet" href="Requirements.css">
</head>
<body>

    <header class="header">
        <div class="logo">Uber</div>
    </header>

    <main class="login-container">

        <div class="login-box">

            <h2>What's your phone number or<br>email?</h2>

            <input
                type="text"
                placeholder="Enter phone number or email"
                class="input-field"
            >

            <button class="continue-btn">Continue</button>

            <div class="or">
                <span></span>
                <p>or</p>
                <span></span>
            </div>

            <button class="social-btn">
                <span class="google-icon">G</span>
                Continue with Google
            </button>

            <button class="social-btn apple-btn">
                <span class="apple-icon">●</span>
                Continue with Apple
            </button>

            <div class="divider"></div>

            <p class="terms">
                You can consent to receive a verification code by text or
                WhatsApp. Message and data rates may apply.
            </p>

        </div>

    </main>

</body>
</html>
